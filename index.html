/* Тёмная тема. Акцент меняется по игре: золото билета HSR, бирюза судьбы Genshin. */

.font-display{font-family:Unbounded,Onest,system-ui,sans-serif;text-wrap:balance}
.app{background:var(--bg)}
.app[data-game=gi]{--accent:#6fd6e8}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
